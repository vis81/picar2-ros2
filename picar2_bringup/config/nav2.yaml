bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # 20 ms is nav2's default and it is far too tight here: it is how long a
    # BT action node waits for a server to *acknowledge* a goal, and on a Pi 4
    # running cartographer/AMCL, nav2, ros2_control, the lidar and the ToF, a
    # scheduling hiccup blows past it routinely. The symptom is a goal that
    # aborts mid-drive with "Timed out while waiting for action server to
    # acknowledge goal request" and reads as a navigation failure — observed
    # ending a waypoint route 0.73 m from its target after two clean legs.
    # A real server failure is still caught, just half a second later.
    default_server_timeout: 500
    action_server_result_timeout: 900.0
    # Ackermann cannot spin in place — use BTs that omit spin recovery.
    # default_nav_through_poses_bt_xml is overridden from nav2.launch.py at
    # runtime to point at config/nav_through_poses_ackermann.xml in the
    # bringup package's share dir.
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

# ── Global planner: Hybrid A* (designed for Ackermann / car-like robots) ─────
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP   # allows forward + reverse
      angle_quantization_bins: 36            # 10° resolution — 72 caused ~42 s startup on Pi 4
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.5            # measured on hardware; theoretical min is ~0.34 m
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      # 6.0, up from the 2.0 default. The controller tracks the plan to
      # within 5 cm, so when the robot runs close to walls it is because the
      # plan does — Smac takes the shortest path and at 2.0 barely minds the
      # inflated cells beside it. A higher penalty pulls the plan toward the
      # middle of a corridor without making inflated cells impassable, which
      # is what raising inflation_radius would do to the 0.33 m pinch.
      # 4.0 was enough at 0.65 m/s; at 0.70 it still entered the pinch on the
      # wall side and lost 7 s a lap there. 6.0 arrives centred: ten laps at
      # 0.70, 28.9 s mean, stdev 1.24, zero reversals.
      cost_penalty: 6.0
      retrospective_penalty: 0.015
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

# ── Local controller: Regulated Pure Pursuit (handles min turning radius) ─────
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5      # suppress noise — Ackermann has no lateral velocity
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    transform_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.50
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.40
      lookahead_dist: 1.0
      min_lookahead_dist: 0.4
      max_lookahead_dist: 2.0
      lookahead_time: 1.0
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      # NOTE: the parameter is *_up_to_carrot. The *_up_to_goal name does not
      # exist in this RPP version, so it was silently ignored and the 1.0 s
      # default applied, projecting the footprint ~0.4 m ahead at 0.4 m/s —
      # almost always in contact among chair and table legs. Verified against
      # the running node with `ros2 param get`.
      # 1.0 s (was 0.5): at 0.70 m/s the 0.5 s check projected only 0.35 m,
      # less than costmap latency plus stopping distance - the robot drove
      # into a person the lidar had tracked from 2.5 m. 1.5 s brushes the
      # pinch walls and aborts the route (sim); 1.0 s is clean there.
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Slow down near obstacles, full speed in the open. Sized from the F1
      # route's measured clearance profile: median 57 cm, and only 6.7% of a
      # lap within 0.30 m of a wall — so this touches the tight spots and
      # nothing else, and desired_linear_vel becomes a ceiling for open space
      # rather than a speed to hold everywhere.
      #
      # inflation_cost_scaling_factor MUST equal the local costmap's
      # cost_scaling_factor (5.0): RPP inverts the inflation exponential to
      # recover distance from cost, and the RPP default of 3.0 gets it wrong
      # silently. cost_scaling_dist must sit under inflation_radius (0.33) —
      # beyond that the cost is zero and there is nothing to scale on.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      # picar2 fork only: regulate on the worst cost along the path this far
      # ahead (0 = robot cell only, upstream behaviour). Tried on f1_route at
      # 0.70: 0.7 m brakes smoothly into the pinch but taxes every corner
      # (-4 s/lap); 0.3 m changes nothing at the pinch. Left off.
      cost_lookahead_dist: 0.0
      inflation_cost_scaling_factor: 5.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false          # Ackermann cannot spin in place
      allow_reversing: true
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0

# ── Recovery behaviors (spin omitted — Ackermann cannot spin in place) ────────
behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    behavior_plugins: [backup, drive_on_heading, wait]
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

# ── Costmaps ──────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      # 0.025, not the map's 0.05. RPP calls a pose a collision when the
      # footprint outline rasterises onto a cell marked LETHAL — inflation is
      # not involved, it compares against 254. At 5 cm cells the robot cannot
      # resolve a gap smaller than one cell: measured on the F1 route, a
      # footprint corner 3.9 cm from the nearest marked cell centre read as a
      # collision and the car stopped dead in a corridor that was open ahead.
      # Halving the cell halves that quantisation error. Costs 4x the cells,
      # but this window is only 3 x 3 m (3600 -> 14400).
      resolution: 0.025
      # base_footprint is at the rear axle; chassis extends ~40 mm behind it
      footprint: "[[-0.04, -0.095], [-0.04, 0.095], [0.30, 0.095], [0.30, -0.095]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan sen0628
        scan:
          topic: /lidar_node/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
        sen0628:
          topic: /sen0628/pointcloud
          data_type: PointCloud2
          marking: true
          clearing: true
          # 0.85, not 1.0. On carpet the shallow-grazing rays read the tops of
          # the pile rather than the backing, so the apparent floor rises with
          # distance: measured 0 cm at 0.5 m and +1.1 cm at 0.6 m, which
          # extrapolates to the 3 cm min_obstacle_height at 0.89 m. Marking out
          # to 1.0 m therefore left a band where carpet could mark itself as an
          # obstacle. Clearing still runs to 1.0 m — clearing on those returns
          # is harmless, only marking is not.
          obstacle_max_range: 0.85
          obstacle_min_range: 0.005
          raytrace_max_range: 1.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.03
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        # This is what RegulatedPurePursuitController checks against when it
        # projects the footprint forward, and 0.5 m leaves almost no cost-0
        # corridor indoors: with 0.53 m clear to one side and 0.69 m to the
        # other it logged 165 "collision ahead" warnings and ran nine backup
        # recoveries without making progress.
        # Floor is the footprint's circumscribed radius, 0.315 m (the rear
        # axle to a front corner: hypot(0.30, 0.095)). Below that Nav2 refuses
        # Smac's non-circular collision checking outright — "inflation radius
        # is smaller than the circumscribed radius" — so 0.25 is not available
        # to this robot however tight the space.
        #
        # Tried 0.33 for the F1 route's 0.33 m pinch, where 0.35 leaves no
        # cost-0 corridor and the planner intermittently reported "no valid
        # path found". It got through the gap — and ran close to walls
        # everywhere else. Back to 0.35 once cost-regulated velocity scaling
        # went on in the controller: with the robot slowing near obstacles the
        # wider margin is affordable again. Do not go below 0.33 in any case:
        # Nav2 reports the circumscribed radius as 0.3273, and under it Smac
        # loses its potential-field shortcut and warns about it every plan.
        inflation_radius: 0.33
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.04, -0.095], [-0.04, 0.095], [0.30, 0.095], [0.30, -0.095]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan sen0628
        scan:
          topic: /lidar_node/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
        sen0628:
          topic: /sen0628/pointcloud
          data_type: PointCloud2
          marking: true
          clearing: true
          # 0.85, not 1.0. On carpet the shallow-grazing rays read the tops of
          # the pile rather than the backing, so the apparent floor rises with
          # distance: measured 0 cm at 0.5 m and +1.1 cm at 0.6 m, which
          # extrapolates to the 3 cm min_obstacle_height at 0.89 m. Marking out
          # to 1.0 m therefore left a band where carpet could mark itself as an
          # obstacle. Clearing still runs to 1.0 m — clearing on those returns
          # is harmless, only marking is not.
          obstacle_max_range: 0.85
          obstacle_min_range: 0.005
          raytrace_max_range: 1.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.03
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        # 0.25, not 0.5: the robot is 0.19 m wide (inscribed radius ~0.095), so
        # 0.5 m of inflation sealed every doorway — 0.5 m from each side covers
        # 1.0 m of a 0.76 m gap. That left no cost-0 corridor through doors,
        # which stranded explore_lite: its frontier search only traverses cells
        # of exactly FREE_SPACE, so the robot sat in a 1.6 m2 pocket with zero
        # reachable frontiers. Local costmap keeps 0.5.
        # 0.40 was the answer to the doorway problem and it fixed
        # dead_end_reverse (3/3 against 1/3 at 0.25, commit b5e24ee).
        # Lowered again to match the local costmap after waypoint routes
        # kept stalling in tight spaces — re-check dead_end_reverse if
        # reverse manoeuvres start failing again.
        # 0.35: see the local costmap's note.
        inflation_radius: 0.33
      always_send_full_costmap: true
