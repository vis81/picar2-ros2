controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    pan_tilt_controller:
      type: forward_command_controller/ForwardCommandController

ackermann_steering_controller:
  ros__parameters:
    # Joint names (non-deprecated form)
    traction_joints_names: [back_right_joint, back_left_joint]
    # RIGHT first, then LEFT - the order steering_kinematics.cpp returns:
    #   steering_commands = {alpha_r, alpha_l}
    # matching traction_joints_names above. Listed left-first, the inner and
    # outer steering angles land on the wrong wheels and the front axle is
    # commanded onto two arcs with no common centre, so a wheel must slide.
    # Measured in sim before the fix: on a left turn the left wheel held
    # 0.4498 rad while the right held 0.6000, the outer wheel steering the
    # harder of the two, and the front wheels rolled 1.5 m over a 3.3 m path
    # against 3.7 m at the rear.
    # Invisible on the robot: picar2_hardware averages the two steering
    # commands into one servo, and swapping a pair does not change its mean.
    steering_joints_names: [front_right_steer_joint, front_left_steer_joint]

    # Robot geometry (metres) — from URDF joint origins
    wheelbase:             0.235    # 0.11922 + 0.11607
    traction_track_width:  0.1685   # 2 × 0.08425
    steering_track_width:  0.173    # left wheel centre 0.0878 + right 0.0845
    traction_wheels_radius: 0.033   # TODO: calibrate with measured travel distance

    # Odometry from encoder feedback (we have real position state interfaces)
    open_loop: false

    # Stop motors if no cmd_vel received for 500 ms (matches firmware watchdog)
    reference_timeout: 0.5

    # Let robot_localization own the odom→base_footprint TF
    enable_odom_tf: false
    base_frame_id: base_footprint

pan_tilt_controller:
  ros__parameters:
    joints: [pan_joint, tilt_joint]
    interface_name: position

cmd_vel_relay:
  ros__parameters:
    max_angular_vel: 1.2    # rad/s — hardware max at 0.4 m/s: v/r = 0.4/0.34 ≈ 1.18
    max_reverse_vel: 0.25   # m/s  — RPPC has no separate reverse speed knob
