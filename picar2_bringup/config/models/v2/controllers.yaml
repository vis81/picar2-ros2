# Chassis v2 geometry for ros2_control, layered over config/controllers.yaml.
# Same numbers as the URDF (picar2_description/models/v2.yaml).
# Measured 2026-10-18 on the assembled chassis.
ackermann_steering_controller:
  ros__parameters:
    wheelbase:             0.142
    traction_track_width:  0.165
    steering_track_width:  0.165
    traction_wheels_radius: 0.0335  # 67 mm wheels; TODO: calibrate with measured travel distance

cmd_vel_relay:
  ros__parameters:
    max_angular_vel: 1.2    # rad/s; TODO: v/r once the full-lock radius is measured (a quick arc gave ~0.27 m)
