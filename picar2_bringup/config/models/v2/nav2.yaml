# Chassis v2 values for Nav2, layered over config/nav2.yaml (later wins at the
# leaf). Only what follows the chassis dimensions lives here; the reasoning
# behind each value stays with the commented-out line in nav2.yaml.
# Measured on the assembled v2 chassis 2026-10-18; turning radius still to measure.
planner_server:
  ros__parameters:
    GridBased:
      minimum_turning_radius: 0.30  # TODO measure full-lock circles; a quick arc gave ~0.27 m, theoretical ~0.20

local_costmap:
  local_costmap:
    ros__parameters:
      # base_footprint is at the rear axle; chassis extends ~40 mm behind it
      footprint: "[[-0.034, -0.095], [-0.034, 0.095], [0.237, 0.095], [0.237, -0.095]]"
      inflation_layer:
        inflation_radius: 0.26      # not below the circumscribed radius (0.2553)

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[-0.034, -0.095], [-0.034, 0.095], [0.237, 0.095], [0.237, -0.095]]"
      inflation_layer:
        inflation_radius: 0.26
