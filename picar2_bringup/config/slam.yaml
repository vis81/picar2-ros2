slam_toolbox:
  ros__parameters:

    # Frames
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint
    scan_topic:  /lidar_node/scan
    mode:        mapping

    # Map resolution and update rate
    resolution:           0.05   # m/cell
    map_update_interval:  5.0    # seconds between map publishes
    max_laser_range:      5.0    # m  — matches lidar range_max

    # Only update the map after meaningful motion (avoids accumulating noise
    # while stationary)
    minimum_travel_distance: 0.1   # m
    minimum_travel_heading:  0.2   # rad (~11°)

    # Scan matching
    scan_buffer_size:                      10
    scan_buffer_maximum_scan_distance:     5.0
    link_match_minimum_response_fine:      0.1
    link_scan_maximum_distance:            1.5
    loop_search_maximum_distance:          3.0

    # Loop closure
    do_loop_closing:                       true
    loop_match_minimum_chain_size:         10
    loop_match_maximum_variance_coarse:    3.0
    loop_match_minimum_response_coarse:    0.35
    loop_match_minimum_response_fine:      0.45

    # Correlation search space
    correlation_search_space_dimension:    0.5
    correlation_search_space_resolution:   0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure search space
    loop_search_space_dimension:           8.0
    loop_search_space_resolution:          0.05
    loop_search_space_smear_deviation:     0.03

    # Scan matcher penalties
    distance_variance_penalty:  0.5
    angle_variance_penalty:     1.0
    fine_search_angle_offset:   0.00349   # ~0.2°
    coarse_search_angle_offset: 0.349     # ~20°
    coarse_angle_resolution:    0.0349    # ~2°
    minimum_angle_penalty:      0.9
    minimum_distance_penalty:   0.5
    use_response_expansion:     true

    # TF / timing
    transform_publish_period:   0.02   # 50 Hz
    tf_buffer_duration:         30.0
    throttle_scans:             1

    enable_interactive_mode: true
