ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # ── Wheel odometry ───────────────────────────────────────────────────────
    odom0: /ackermann_steering_controller/odometry
    # x  y      z      roll   pitch  yaw    vx     vy     vz
    # vroll  vpitch  vyaw   ax     ay     az
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative:     false
    odom0_queue_size:   10

    # ── IMU (Madgwick-filtered orientation + angular rate + accel) ───────────
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_differential: false
    imu0_relative:     false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    publish_tf:          true
    publish_acceleration: false
    print_diagnostics:   true
