# 1.5 m/s, approach ramp 2.5 m and a real DWPP deceleration limit (1.5 m/s^2)
# so the command cannot drop faster than the car can shed speed (#2).
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 1.5
      approach_velocity_scaling_dist: 2.5
      max_linear_decel: -1.5
