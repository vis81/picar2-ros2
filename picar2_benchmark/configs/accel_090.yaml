# DWPP with only the linear acceleration limited (0.8 m/s2). Decel and the
# angular limits are effectively off (decel limits are negative by upstream
# convention), so braking and steering are RPP's own.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.9
      use_dynamic_window: true
      max_linear_accel: 0.8
      max_linear_decel: -100.0
      max_angular_vel: 10.0
      min_angular_vel: -10.0
      max_angular_accel: 1000.0
      max_angular_decel: -1000.0
