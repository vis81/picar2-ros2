# Sim probe: wider regulation ring (local inflation 0.40, cost_scaling_dist 0.40)
# so the f1_route pinch registers at all in sim, with cost_lookahead_dist 0.7.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.70
      cost_scaling_dist: 0.40
      cost_lookahead_dist: 0.7
local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.40
