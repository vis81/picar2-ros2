# 0.40 m/s with the current controller settings (DWPP accel 0.8, cap 0.75):
# the slow-speed sanity check - the stack used to be unstable when slow.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.40
      use_dynamic_window: true
      max_linear_accel: 0.8
      max_linear_decel: -100.0
      max_angular_vel: 10.0
      min_angular_vel: -10.0
      max_angular_accel: 1000.0
      max_angular_decel: -1000.0
      max_collision_check_dist: 0.75
