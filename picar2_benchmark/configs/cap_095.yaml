# DWPP accel-only (0.8) plus max_collision_check_dist 0.75: the collision
# projection capped at 0.75 m instead of 1.0 s x speed.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.95
      use_dynamic_window: true
      max_linear_accel: 0.8
      max_collision_check_dist: 0.75
      max_linear_decel: -100.0
      max_angular_vel: 10.0
      min_angular_vel: -10.0
      max_angular_accel: 1000.0
      max_angular_decel: -1000.0
