# DWPP accel-only (0.8 m/s2) plus path_curvature_lookahead_dist 0.8: does the
# corner braking still trip the crawl-and-shunt loop once launches are limited?
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.70
      path_curvature_lookahead_dist: 0.8
      use_dynamic_window: true
      max_linear_accel: 0.8
      max_linear_decel: -100.0
      max_angular_vel: 10.0
      min_angular_vel: -10.0
      max_angular_accel: 1000.0
      max_angular_decel: -1000.0
