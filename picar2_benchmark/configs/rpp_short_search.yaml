# max_robot_pose_search_dist is the lever for the upstream pruning bug: RPP
# prunes to the nearest plan pose within this radius, so on a cusped path a pose
# *after* the cusp can be nearer and the reverse leg gets skipped.
#
# Measurement says pruning is NOT occurring here (plan cusps 5, received 5), so
# this arm is expected to change little. Included as a control: if it does help,
# the cusp count was not telling the whole story.
controller_server:
  ros__parameters:
    FollowPath:
      max_robot_pose_search_dist: 0.5
