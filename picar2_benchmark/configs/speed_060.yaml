# The top speed the robot was actually measured at, so a sim lap can be compared
# against a floor lap without normalising for speed.
#
# The 0.60 m/s sweep on the F1 route gave 32.8 s/lap with 0 collisions — the
# best of 0.50 / 0.55 / 0.60 and the run the hardware baseline comes from. The
# config default is 0.40, so an unmodified sim run is ~25% slower by
# construction and the difference says nothing about navigation.
#
# Only desired_linear_vel: on the robot the ceiling is cmd_vel_relay's
# max_angular_vel of 1.2 rad/s, which the web UI already derives from the same
# one speed setting (min(1.2, v / 0.34)), and 0.60 / 0.34 = 1.76 is above it —
# so 1.2 is the cap at this speed either way and there is nothing to overlay.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.60
