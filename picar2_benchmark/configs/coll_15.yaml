# RPP collision horizon 1.5 s (was 0.5): at 0.70 m/s the 0.5 s check is 0.35 m,
# less than costmap latency plus stopping distance - the robot drove into a
# person the lidar had seen from 2.5 m. Longer horizon: stops for people,
# but may also stop for the pinch walls the arc projection brushes.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.70
      max_allowed_time_to_collision_up_to_carrot: 1.5
