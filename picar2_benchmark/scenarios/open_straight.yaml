name: open_straight
description: >
  Sanity and determinism baseline. No obstacles between start and goal, so any
  failure here is the harness, not navigation. This is the scenario the
  reproducibility envelope is measured on.

  The world is sized so every wall is inside the 5 m lidar range of the start
  pose. That is what makes the scenario runnable in all three localisation
  modes: under slam the costmap is sized from cartographer's map, which covers
  only where the lidar got a return, so a goal beyond the visible walls can
  never be planned to. See spec.slam_envelope.
world: {size: [5.5, 4.5], rtf: 0.5, max_step: 0.001}
obstacles: []
start: {x: -2.0, y: 0.0, yaw: 0.0}
goal:  {x:  2.0, y: 0.0, yaw: 0.0}
timeout_s: 60
