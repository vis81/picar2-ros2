name: low_obstacle
description: >
  A 6 cm high barrier across an otherwise clear straight run, absent from the
  static map. Nothing but the front ToF can find it, and the only correct
  behaviour is to stop short of it.

  The LD19's scan plane is 0.1485 m above the ground, so a 6 cm barrier is
  invisible to the lidar. The SEN0628 sits at 0.0755 m looking level with a 45
  degree vertical field of view, so it is well inside what that can see. Leaving
  it out of the static map is what makes the test mean anything: a mapped
  obstacle is planned around whether or not any sensor detects it, so the
  scenario would pass with the ToF unplugged.

  This guards the fix for the carpet false positives. The ToF marks the floor as
  an obstacle on carpet because it is aimed slightly into the ground - its
  bottom ray meets the floor 0.18 m ahead - and only min_obstacle_height's 3 cm
  separates floor from obstacle. Every way of quieting that risks blinding the
  sensor to the low obstacles it exists to catch. Raise min_obstacle_height past
  0.06, or pull obstacle_max_range in below the range the barrier is first seen
  at, and the robot drives straight through this one.

  The barrier spans the corridor deliberately, so the goal beyond it is
  genuinely unreachable and the trial does NOT expect SUCCEEDED. Driving round
  an unmapped low obstacle is barely within this robot's reach: the ToF marks
  only within 1.0 m, a 0.5 m turning radius yields at most 0.708 m of lateral
  shift over that distance, and inflation_radius adds 0.35 m to each side of
  whatever is found - so a 0.6 m box already needs 0.745 m and cannot be
  cleared, and even a 0.4 m one needs 0.645 m, leaving nothing for reaction
  time. Measured: 1.2 m and 0.6 m boxes both ended with the robot stopped
  3-72 mm short and the behaviour tree giving up. Stopping is the right answer,
  so stopping is what is asserted.

  What this pins down is therefore detection and nothing else: the robot drove
  at the barrier and never touched it. If the ToF stops seeing low obstacles,
  clearance goes negative and this fails loudly.
world: {size: [5.0, 5.0], rtf: 0.5, max_step: 0.001}
obstacles:
  # sz 0.06: under the lidar, over min_obstacle_height.
  # mapped false: the robot has to see it for itself.
  # sy 4.6: spans the corridor, so there is no way round and the trial measures
  # detection rather than the planner's agility.
  - {x: 0.0, y: 0.0, sx: 0.4, sy: 4.6, sz: 0.06, mapped: false}
start: {x: -1.80, y: 0.0, yaw: 0.0}
goal:  {x:  1.60, y: 0.0, yaw: 0.0}
timeout_s: 120
expect:
  # min_(min_clearance_m): the closest the robot ever came to any obstacle,
  # the barrier included, stayed at or above zero. Negative means it drove
  # through something it should have seen.
  min_min_clearance_m: 0.0
  # ...having actually driven at it. Without this, a robot that never moved for
  # any unrelated reason would satisfy the clearance bound trivially.
  min_gt_path_m: 1.0
